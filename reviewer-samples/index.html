<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Gourmise OCR Review Samples</title>
  <meta name="description" content="Sample images for testing Gourmise recipe, package, and grocery-list scanning.">
  <style>
    :root { color-scheme: light dark; --accent: #d9662f; --page: #f7f1e8; --text: #281713; --muted: #715f58; --card: #fffaf4; }
    @media (prefers-color-scheme: dark) { :root { --page: #1c100d; --text: #f8eee7; --muted: #c6b5ad; --card: #281713; } }
    body { margin: 0; background: var(--page); color: var(--text); font: 17px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    main { max-width: 900px; margin: 0 auto; padding: 48px 24px 80px; }
    h1 { font-size: 40px; line-height: 1.1; margin-bottom: 8px; }
    p { color: var(--muted); }
    .back { display: inline-block; margin-bottom: 24px; color: var(--accent); }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 20px; margin-top: 30px; }
    article { padding: 18px; background: var(--card); border: 1px solid color-mix(in srgb, var(--text) 14%, transparent); border-radius: 18px; }
    article h2 { font-size: 20px; margin: 0 0 12px; }
    img { display: block; width: 100%; aspect-ratio: 3 / 4; object-fit: cover; border-radius: 12px; }
    article a { display: inline-block; margin-top: 14px; color: var(--accent); font-weight: 700; }
  </style>
</head>
<body>
  <main>
    <a class="back" href="../">Gourmise home</a>
    <h1>OCR Review Samples</h1>
    <p>Save these images to the device photo library to test Gourmise's cookbook, package-instruction, and handwritten grocery-list scanners.</p>
    <div class="grid">
      <article>
        <h2>Family recipe</h2>
        <img src="01-family-recipe-scan.jpg" alt="Sample handwritten family recipe">
        <a href="01-family-recipe-scan.jpg" download>Download full image</a>
      </article>
      <article>
        <h2>Package directions</h2>
        <img src="02-package-directions.jpg" alt="Sample package cooking directions">
        <a href="02-package-directions.jpg" download>Download full image</a>
      </article>
      <article>
        <h2>Grocery list</h2>
        <img src="03-handwritten-grocery-list.jpg" alt="Sample handwritten grocery list">
        <a href="03-handwritten-grocery-list.jpg" download>Download full image</a>
      </article>
    </div>
  </main>
</body>
</html>
