<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Gourmise</title>
  <meta name="description" content="Privacy and support information for Gourmise.">
  <style>
    :root { color-scheme: light dark; --accent: #d9662f; --page: #f7f1e8; --text: #281713; --card: #fffaf4; }
    @media (prefers-color-scheme: dark) { :root { --page: #1c100d; --text: #f8eee7; --card: #281713; } }
    body { margin: 0; background: var(--page); color: var(--text); font: 17px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    main { max-width: 760px; margin: 0 auto; padding: 64px 24px; }
    h1 { font-size: 46px; line-height: 1.05; margin: 0 0 12px; }
    p { margin: 0 0 22px; }
    nav { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 16px; margin-top: 32px; }
    a { color: var(--accent); }
    nav a { display: block; padding: 22px; background: var(--card); border: 1px solid color-mix(in srgb, var(--text) 14%, transparent); border-radius: 18px; text-decoration: none; font-weight: 700; }
  </style>
</head>
<body>
  <main>
    <h1>Gourmise</h1>
    <p>Recipes, scans, kitchen tools, timers, grocery lists, and meal planning in one place.</p>
    <nav aria-label="Gourmise information">
      <a href="privacy/">Privacy Policy</a>
      <a href="support/">Support</a>
    </nav>
  </main>
</body>
</html>
